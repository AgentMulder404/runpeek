[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runpeek"
version = "0.4.0a1"
description = "RunPeek by NemulAI — see where your AI spends time and tokens. Local-first observability for supported AI applications and Claude Code sessions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "NemulAI" }]
keywords = ["observability", "llm", "openai", "claude-code", "tokens", "cost", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Debuggers",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
sync = ["keyring>=25,<26"]
mcp = ["mcp>=2,<3"]
installer = ["mcp>=2,<3", "pyinstaller>=6.10,<7"]
dev = [
  "pytest>=8",
  "mcp>=2,<3",
  "openai==2.44.0",
  "httpx>=0.28",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.urls]
Repository = "https://github.com/AgentMulder404/runpeek"
Changelog = "https://github.com/AgentMulder404/runpeek/blob/main/CHANGELOG.md"
Security = "https://github.com/AgentMulder404/runpeek/blob/main/SECURITY.md"

[project.scripts]
runpeek = "runpeek.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runpeek = ["schema.sql", "rates/*.json", "_boot/*.py", "py.typed"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/runpeek"]
ignore_missing_imports = true
