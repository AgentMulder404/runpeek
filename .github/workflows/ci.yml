name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (dev extras; no provider credentials are used anywhere)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples
      - name: Type-check
        run: mypy
      - name: Tests (offline)
        env:
          NO_COLOR: "1"
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel in a clean environment and smoke it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/runpeek --version
          /tmp/clean/bin/runpeek --help > /dev/null
          /tmp/clean/bin/python -c "import runpeek; print(runpeek.__version__)"
          # core works without the openai package: bootstrap fails open, summary reports no observations
          /tmp/clean/bin/runpeek run --db /tmp/clean/r.db -- /tmp/clean/bin/python -c "print('ok')" | grep -q "No AI calls were observed"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
